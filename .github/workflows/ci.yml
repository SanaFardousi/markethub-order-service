name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Restore Certificate
        run: |
          echo "${{ secrets.NETWORK_CERTIFICATE }}" | base64 --decode > company-root-ca.cer

      - name: Set up JDK 21 with a Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload the JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Build the Docker image
        run: docker build -t markethub-order-service:ci .
