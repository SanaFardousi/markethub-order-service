spring:
  application:
    name: markethub-order-service
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
    consumer:
      group-id: markethub-order-service
      auto-offset-reset: earliest

markethub:
  outbox:
    poll-interval: PT0.5S


management:
  endpoints:
    web:
      exposure:
        include: health,info
