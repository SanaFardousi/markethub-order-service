spring:
  application:
    name: markethub-order-service
  profiles:
    default: local
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    producer:
      acks: all
      value-serializer: com.markethub.orders.infrastructure.kafka.StringOrBytesSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
    consumer:
      group-id: markethub-order-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.markethub.orders.infrastructure.kafka.JsonTextDeserializer
    listener:
      ack-mode: RECORD

markethub:
  outbox:
    poll-interval: PT0.5S
  search:
    url: ${ELASTICSEARCH_URL:http://localhost:9200}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
    access:
      default: unrestricted
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  simple:
    metrics:
      export:
        enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: MarketHub Order & Search Service
    description: Prices baskets with Drools, takes orders, publishes events to Kafka and serves product search

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
